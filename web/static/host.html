<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Викторина — Ведущий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0B0F2A;
    --bg-2: #1B1440;
    --bg-3: #2A123F;
    --surface: #171233;
    --surface-line: rgba(255,255,255,0.09);
    --ink: #F3F1FF;
    --muted: #9A9FC4;

    --gold: #FFC857;
    --violet: #8B7CFF;
    --teal: #2FE6C1;
    --rose: #FF5C8A;
    --wrong: #FF4757;

    --radius-lg: 24px;
    --radius-md: 16px;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    position: relative;
    overflow-x: hidden;
    background: var(--bg-1);
  }

  /* --- фон: медленно дрейфующая "аврора" --- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora span {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: .35;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1) { width: 620px; height: 620px; background: var(--violet); top: -220px; left: -160px; }
  .aurora span:nth-child(2) { width: 520px; height: 520px; background: var(--rose); bottom: -200px; right: -140px; animation-duration: 26s; animation-delay: -6s; }
  .aurora span:nth-child(3) { width: 460px; height: 460px; background: var(--teal); top: 30%; right: 10%; animation-duration: 30s; animation-delay: -14s; opacity: .2; }
  @keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(60px,-40px) scale(1.12); }
  }

  h1 { font-family: "Fredoka", sans-serif; font-size: 30px; font-weight: 600; margin: 0 0 22px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  input {
    width: 100%;
    padding: 15px 16px;
    font-size: 16px;
    font-family: inherit;
    border-radius: var(--radius-md);
    border: 1px solid var(--surface-line);
    background: rgba(255,255,255,0.04);
    color: var(--ink);
    margin-bottom: 16px;
    transition: border-color .2s var(--ease), background .2s var(--ease);
  }
  input:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.07); }

  button {
    background: var(--gold);
    color: #221200;
    border: none;
    padding: 15px 26px;
    font-size: 16px;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: transform .15s var(--ease), box-shadow .15s var(--ease), opacity .15s;
    box-shadow: 0 8px 20px -8px rgba(255,200,87,0.55);
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 26px -8px rgba(255,200,87,0.65); }
  button:active:not(:disabled) { transform: translateY(0) scale(.98); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

  .error { color: var(--wrong); margin-top: 4px; font-size: 14px; }
  .hidden { display: none !important; }

  .screen { width: 100%; max-width: 980px; position: relative; z-index: 1; }
  .card {
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius-lg);
    padding: 40px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,.55);
    animation: rise .5s var(--ease) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* --- экран ожидания --- */
  .room-code-label { color: var(--muted); font-size: 16px; margin-bottom: 6px; text-align: center; }
  .room-code {
    font-family: "Fredoka", sans-serif;
    font-size: 76px;
    font-weight: 700;
    letter-spacing: 10px;
    background: linear-gradient(135deg, var(--gold), var(--rose));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-align: center;
    margin: 10px 0 28px;
  }
  .pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-right: 10px; animation: pulse 1.4s ease-in-out infinite; vertical-align: middle; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .4; } }
  .waiting-hint { text-align: center; color: var(--muted); font-size: 17px; margin-bottom: 8px; }

  .chip-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .chip {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--surface-line);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 15px; font-weight: 500;
    animation: pop .35s var(--ease) both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }

  /* --- игровой экран --- */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .qcounter { color: var(--muted); font-size: 14px; font-weight: 500; }

  .ring-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: var(--surface-line); stroke-width: 6; }
  .ring-fill { fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .9s linear, stroke .25s; }
  .ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 18px; }

  .game-layout { display: grid; grid-template-columns: 1fr 320px; gap: 26px; }
  @media (max-width: 860px) { .game-layout { grid-template-columns: 1fr; } }

  .question-text { font-family: "Fredoka", sans-serif; font-size: 34px; font-weight: 600; line-height: 1.25; margin-bottom: 26px; animation: rise .45s var(--ease) both; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .options { grid-template-columns: 1fr; } }
  .option {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    border-radius: var(--radius-md);
    padding: 20px 20px 20px 18px;
    font-size: 18px; font-weight: 500;
    color: #17102a;
    overflow: hidden;
    animation: pop .4s var(--ease) both;
  }
  .option:nth-child(1) { background: var(--gold); }
  .option:nth-child(2) { background: var(--violet); color: #fff; }
  .option:nth-child(3) { background: var(--teal); }
  .option:nth-child(4) { background: var(--rose); color: #fff; }
  .option .idx {
    width: 30px; height: 30px; flex-shrink: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.28);
    display: flex; align-items: center; justify-content: center;
    font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 14px;
  }

  .side-panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius-lg);
    padding: 22px;
    display: flex; flex-direction: column;
  }
  .side-panel h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 14px; }
  .answered-meter { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .answered-meter b { color: var(--teal); }

  .player-row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    font-size: 15px;
    border-bottom: 1px solid var(--surface-line);
  }
  .player-row:last-child { border-bottom: none; }
  .rank { font-family: "Fredoka", sans-serif; font-weight: 600; color: var(--muted); font-size: 14px; }
  .rank.top1 { color: var(--gold); } .rank.top2 { color: #D7DBEE; } .rank.top3 { color: #E3A15E; }
  .p-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-score { font-family: "Fredoka", sans-serif; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
  .p-score.bump { animation: bump .4s var(--ease); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.3); color: #fff; } 100% { transform: scale(1); } }

  .board-list { display: flex; flex-direction: column; }

  .next-btn-wrap { margin-top: 22px; display: flex; justify-content: flex-end; }

  /* --- финальный экран --- */
  .finished-title { font-family: "Fredoka", sans-serif; font-size: 38px; font-weight: 600; text-align: center; margin-bottom: 8px; }
  .finished-sub { text-align: center; color: var(--muted); margin-bottom: 34px; }

  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin-bottom: 36px; }
  .podium-slot { width: 130px; text-align: center; }
  .podium-name { font-weight: 600; margin-bottom: 6px; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium-score { color: var(--muted); font-size: 13px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .podium-block { border-radius: 12px 12px 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; font-size: 26px; animation: grow .6s var(--ease) both; }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .podium-block { transform-origin: bottom; }
  .p1 .podium-block { height: 130px; background: linear-gradient(180deg, var(--gold), #B8860B); }
  .p2 .podium-block { height: 95px; background: linear-gradient(180deg, #D7DBEE, #8A90B5); animation-delay: .08s; }
  .p3 .podium-block { height: 68px; background: linear-gradient(180deg, #E3A15E, #8A5A2B); animation-delay: .16s; }
  .podium-slot.p1 { order: 2; } .podium-slot.p2 { order: 1; } .podium-slot.p3 { order: 3; }

  .rest-list { max-width: 520px; margin: 0 auto; }

  /* --- библиотека квизов --- */
  .lib-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .lib-head h1 { margin: 0; }
  button.ghost { background: rgba(255,255,255,0.07); color: var(--ink); border: 1px solid var(--surface-line); box-shadow: none; }
  button.ghost:hover:not(:disabled) { background: rgba(255,255,255,0.12); box-shadow: none; }
  button.small { padding: 9px 16px; font-size: 14px; }

  .quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .quiz-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius-md);
    padding: 20px;
    display: flex; flex-direction: column; gap: 6px;
    animation: pop .35s var(--ease) both;
    transition: border-color .2s var(--ease), transform .2s var(--ease);
  }
  .quiz-card:hover { border-color: rgba(255,200,87,0.5); transform: translateY(-2px); }
  .quiz-card.fresh { border-color: var(--teal); }
  .quiz-title { font-family: "Fredoka", sans-serif; font-size: 20px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .quiz-meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .quiz-card button { margin-top: auto; }
  .empty-note { color: var(--muted); text-align: center; padding: 34px 0; grid-column: 1 / -1; }

  /* --- редактор квиза --- */
  .q-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius-md);
    padding: 20px;
    margin-bottom: 16px;
    animation: pop .3s var(--ease) both;
  }
  .q-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .q-num { font-family: "Fredoka", sans-serif; font-weight: 600; flex: 1; }
  .time-field { display: flex; align-items: center; gap: 8px; margin: 0; }
  .time-field input { width: 76px; margin: 0; padding: 8px 10px; text-align: center; }
  .q-card input[type="text"] { margin-bottom: 12px; }
  .opt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .opt-row input[type="text"] { margin: 0; flex: 1; }
  .opt-row input[type="radio"] { width: 20px; height: 20px; margin: 0; accent-color: var(--teal); flex-shrink: 0; cursor: pointer; }
  .opt-hint { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .editor-actions { display: flex; gap: 12px; justify-content: space-between; margin-top: 22px; flex-wrap: wrap; }
  .editor-actions .right { display: flex; gap: 12px; }
  .lib-note { color: var(--teal); font-size: 14px; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>

<div class="screen">

  <!-- Экран 1: создание комнаты -->
  <div class="card" id="library-screen">
    <div class="lib-head">
      <h1>Мои викторины</h1>
      <button id="new-quiz-btn">+ Создать квиз</button>
    </div>
    <div class="lib-note hidden" id="library-note"></div>
    <div class="quiz-grid" id="quiz-grid"></div>
    <div class="error hidden" id="library-error"></div>
  </div>

  <!-- Экран 1б: редактор квиза -->
  <div class="card hidden" id="editor-screen">
    <h1>Новый квиз</h1>
    <label for="quiz-title">Название</label>
    <input id="quiz-title" type="text" placeholder="Например: Столицы мира" maxlength="80">
    <div id="editor-questions"></div>
    <div class="editor-actions">
      <button class="ghost" id="add-question-btn">+ Добавить вопрос</button>
      <div class="right">
        <button class="ghost" id="editor-cancel-btn">Отмена</button>
        <button id="editor-save-btn">Сохранить квиз</button>
      </div>
    </div>
    <div class="error hidden" id="editor-error"></div>
  </div>

  <!-- Экран 2: комната ждёт игроков -->
  <div class="card hidden" id="waiting-screen">
    <div class="room-code-label">Код комнаты — вводите на телефонах</div>
    <div class="room-code" id="room-code-display">----</div>
    <div class="waiting-hint"><span class="pulse-dot"></span><span id="waiting-hint-text">Ждём игроков...</span></div>
    <div class="chip-grid" id="waiting-players"></div>
    <div class="next-btn-wrap"><button id="start-btn">Начать викторину</button></div>
  </div>

  <!-- Экран 3: активный вопрос -->
  <div class="card hidden" id="game-screen">
    <div class="topbar">
      <div class="qcounter" id="qcounter">Вопрос</div>
      <div class="ring-wrap">
        <svg viewBox="0 0 64 64">
          <circle class="ring-track" cx="32" cy="32" r="27"></circle>
          <circle class="ring-fill" id="ring-fill" cx="32" cy="32" r="27" stroke-dasharray="169.6"></circle>
        </svg>
        <div class="ring-num" id="timer-num">--</div>
      </div>
    </div>

    <div class="game-layout">
      <div>
        <div class="question-text" id="question-text"></div>
        <div class="options" id="options"></div>
      </div>

      <div class="side-panel">
        <h2>Таблица лидеров</h2>
        <div class="answered-meter hidden" id="answered-meter"></div>
        <div class="board-list" id="players-list"></div>
      </div>
    </div>

    <div class="next-btn-wrap"><button id="next-btn">Следующий вопрос</button></div>
  </div>

  <!-- Экран 4: игра окончена -->
  <div class="card hidden" id="finished-screen">
    <div class="finished-title">Игра окончена 🏆</div>
    <div class="finished-sub">Финальные результаты</div>
    <div class="podium" id="podium"></div>
    <div class="rest-list board-list" id="rest-players"></div>
  </div>

</div>

<script>
// ==== Настройки ====
// Раньше был жёстко забит "http://localhost:8080" — это работает только на
// компьютере ведущего, а с телефонов "localhost" означает сам телефон, а не
// сервер. Теперь бэкенд ищется на том же хосте, с которого открыта сама
// страница (если открыть её как файл — хост пустой, тогда используем localhost
// для локальной разработки).
const API_BASE = `http://${location.hostname || "localhost"}:8080`;
const DEBUG = true; // выведет в консоль сырой /state — удобно, чтобы сверить имена полей с бэкендом

// ==== Состояние приложения ====
let roomCode = null;
let pollIntervalId = null;
let questionStartedAt = null;
let roundDuration = null; // сколько секунд длится раунд — определяем динамически по первому значению

// Защита от бага с обнулением очков: /state иногда может вернуть на секунду
// устаревший/нулевой счёт (например, если бэкенд ещё не успел применить ответ,
// либо каждый раз пересобирает players и теряет накопленный score).
// Раз счёт в этой игре может только расти, храним максимум из всего, что видели —
// это не чинит бэкенд, но не даёт интерфейсу "моргать" нулём.
let knownScores = {};

// ==== Ссылки на элементы экрана ====
const screens = {
  library: document.getElementById("library-screen"),
  editor: document.getElementById("editor-screen"),
  waiting: document.getElementById("waiting-screen"),
  game: document.getElementById("game-screen"),
  finished: document.getElementById("finished-screen"),
};

function showScreen(name) {
  Object.values(screens).forEach(el => el.classList.add("hidden"));
  screens[name].classList.remove("hidden");
}

// ==== Шаг 0: библиотека квизов ====
const libraryErrorEl = document.getElementById("library-error");

function showLibraryError(msg) {
  libraryErrorEl.textContent = msg;
  libraryErrorEl.classList.toggle("hidden", !msg);
}

async function loadQuizzes(freshId = null) {
  const grid = document.getElementById("quiz-grid");
  showLibraryError("");
  try {
    const res = await fetch(`${API_BASE}/quizzes`);
    if (!res.ok) throw new Error(`Ошибка сервера: ${res.status}`);
    const data = await res.json();
    // бэкенд может вернуть массив или объект вида { quizzes: [...] }
    const quizzes = Array.isArray(data) ? data : (data.quizzes || []);
    renderQuizzes(quizzes, freshId);
  } catch (err) {
    grid.innerHTML = "";
    showLibraryError("Не удалось загрузить список квизов. Запущен ли сервер? (" + err.message + ")");
  }
}

function pluralQuestions(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return `${n} вопрос`;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return `${n} вопроса`;
  return `${n} вопросов`;
}

function renderQuizzes(quizzes, freshId) {
  const grid = document.getElementById("quiz-grid");
  grid.innerHTML = "";
  if (!quizzes.length) {
    grid.innerHTML = `<div class="empty-note">Пока нет ни одного квиза — создайте первый.</div>`;
    return;
  }
  quizzes.forEach((quiz, i) => {
    const card = document.createElement("div");
    card.className = "quiz-card" + (quiz.id === freshId ? " fresh" : "");
    card.style.animationDelay = `${i * 0.04}s`;

    const title = document.createElement("div");
    title.className = "quiz-title";
    title.textContent = quiz.title || "Без названия";

    const meta = document.createElement("div");
    meta.className = "quiz-meta";
    meta.textContent = Array.isArray(quiz.questions) ? pluralQuestions(quiz.questions.length) : "";

    const btn = document.createElement("button");
    btn.textContent = "Запустить";
    btn.addEventListener("click", () => startRoom(quiz.id, btn));

    card.append(title, meta, btn);
    grid.appendChild(card);
  });
}

// ==== Шаг 1: создание комнаты из карточки квиза ====
async function startRoom(quizId, btn) {
  showLibraryError("");
  btn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/rooms`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ quiz_id: String(quizId) }),
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || `Ошибка сервера: ${res.status}`);
    }
    const room = await res.json();
    roomCode = room.room_id;
    document.getElementById("room-code-display").textContent = roomCode;
    showScreen("waiting");
    startPollingWaitingRoom();
  } catch (err) {
    showLibraryError(err.message);
    btn.disabled = false;
  }
}

// ==== Редактор квиза ====
const MAX_OPTIONS = 4; // столько цветов у плиток ответов
const MIN_OPTIONS = 2;
let editorQuestions = [];

function newQuestion() {
  return { text: "", options: ["", ""], correct: 0, time: 15 };
}

document.getElementById("new-quiz-btn").addEventListener("click", () => {
  document.getElementById("quiz-title").value = "";
  editorQuestions = [newQuestion()];
  document.getElementById("library-note").classList.add("hidden");
  setEditorError("");
  renderEditor();
  showScreen("editor");
});

document.getElementById("add-question-btn").addEventListener("click", () => {
  editorQuestions.push(newQuestion());
  renderEditor();
  const cards = document.querySelectorAll(".q-card");
  cards[cards.length - 1].scrollIntoView({ behavior: "smooth", block: "center" });
});

document.getElementById("editor-cancel-btn").addEventListener("click", () => showScreen("library"));

function setEditorError(msg) {
  const el = document.getElementById("editor-error");
  el.textContent = msg;
  el.classList.toggle("hidden", !msg);
}

// Поля ввода пишут прямо в модель editorQuestions (без перерисовки, чтобы не терять фокус);
// полная перерисовка — только когда меняется структура (добавили/удалили вопрос или вариант).
function renderEditor() {
  const box = document.getElementById("editor-questions");
  box.innerHTML = "";

  editorQuestions.forEach((q, qi) => {
    const card = document.createElement("div");
    card.className = "q-card";

    const head = document.createElement("div");
    head.className = "q-head";
    head.innerHTML = `<span class="q-num">Вопрос ${qi + 1}</span>
      <label class="time-field">Время, с <input type="number" min="5" max="300"></label>`;
    const timeInput = head.querySelector("input");
    timeInput.value = q.time;
    timeInput.addEventListener("input", () => { q.time = Number(timeInput.value); });
    if (editorQuestions.length > 1) {
      const del = document.createElement("button");
      del.className = "ghost small";
      del.textContent = "Удалить";
      del.addEventListener("click", () => { editorQuestions.splice(qi, 1); renderEditor(); });
      head.appendChild(del);
    }
    card.appendChild(head);

    const text = document.createElement("input");
    text.type = "text";
    text.placeholder = "Текст вопроса";
    text.value = q.text;
    text.addEventListener("input", () => { q.text = text.value; });
    card.appendChild(text);

    const hint = document.createElement("div");
    hint.className = "opt-hint";
    hint.textContent = "Отметьте кружком правильный вариант";
    card.appendChild(hint);

    q.options.forEach((opt, oi) => {
      const row = document.createElement("div");
      row.className = "opt-row";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = `correct-${qi}`;
      radio.checked = q.correct === oi;
      radio.addEventListener("change", () => { q.correct = oi; });

      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = `Вариант ${oi + 1}`;
      input.value = opt;
      input.addEventListener("input", () => { q.options[oi] = input.value; });

      row.append(radio, input);

      if (q.options.length > MIN_OPTIONS) {
        const rm = document.createElement("button");
        rm.className = "ghost small";
        rm.textContent = "✕";
        rm.title = "Убрать вариант";
        rm.addEventListener("click", () => {
          q.options.splice(oi, 1);
          if (q.correct === oi) q.correct = 0;
          else if (q.correct > oi) q.correct -= 1;
          renderEditor();
        });
        row.appendChild(rm);
      }
      card.appendChild(row);
    });

    if (q.options.length < MAX_OPTIONS) {
      const add = document.createElement("button");
      add.className = "ghost small";
      add.textContent = "+ Вариант";
      add.addEventListener("click", () => { q.options.push(""); renderEditor(); });
      card.appendChild(add);
    }

    box.appendChild(card);
  });
}

function validateQuiz() {
  const title = document.getElementById("quiz-title").value.trim();
  if (!title) return "Введите название квиза";
  for (let i = 0; i < editorQuestions.length; i++) {
    const q = editorQuestions[i];
    const n = i + 1;
    if (!q.text.trim()) return `Вопрос ${n}: введите текст вопроса`;
    if (q.options.some(o => !o.trim())) return `Вопрос ${n}: заполните все варианты ответа (или уберите лишние)`;
    if (!Number.isFinite(q.time) || q.time < 5 || q.time > 300) return `Вопрос ${n}: время должно быть от 5 до 300 секунд`;
  }
  return null;
}

document.getElementById("editor-save-btn").addEventListener("click", async () => {
  const problem = validateQuiz();
  if (problem) { setEditorError(problem); return; }
  setEditorError("");

  const payload = {
    title: document.getElementById("quiz-title").value.trim(),
    questions: editorQuestions.map((q, i) => ({
      id: `q${i + 1}`,
      text: q.text.trim(),
      options: q.options.map(o => o.trim()),
      correct_option: q.correct,
      time_limit: q.time,
    })),
  };

  const saveBtn = document.getElementById("editor-save-btn");
  saveBtn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/quiz`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || `Ошибка сервера: ${res.status}`);
    }
    const created = await res.json().catch(() => ({}));
    const note = document.getElementById("library-note");
    note.textContent = `Квиз «${payload.title}» сохранён`;
    note.classList.remove("hidden");
    showScreen("library");
    await loadQuizzes(created && created.id ? String(created.id) : null);
  } catch (err) {
    setEditorError(err.message);
  } finally {
    saveBtn.disabled = false;
  }
});

// ==== Шаг 2: пока ждём игроков — опрашиваем /state, чтобы обновлять список игроков ====
function startPollingWaitingRoom() {
  pollIntervalId = setInterval(async () => {
    const state = await fetchState();
    if (!state) return;
    renderWaitingPlayers(state.players);
  }, 1000);
}

const lobbyChipRefs = {}; // playerId -> DOM-элемент

function renderWaitingPlayers(playersMap) {
  const container = document.getElementById("waiting-players");
  const hint = document.getElementById("waiting-hint-text");
  const players = Object.values(playersMap || {});
  hint.textContent = players.length ? `Игроков в комнате: ${players.length}` : "Ждём игроков...";

  const currentIds = players.map(p => p.id);
  Object.keys(lobbyChipRefs).forEach(id => {
    if (!currentIds.includes(id)) {
      lobbyChipRefs[id].remove();
      delete lobbyChipRefs[id];
    }
  });

  // добавляем только новых игроков, существующих не трогаем
  players.forEach(p => {
    if (!lobbyChipRefs[p.id]) {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = p.name;
      lobbyChipRefs[p.id] = chip;
      container.appendChild(chip);
    }
  });
}

// ==== Шаг 3: запуск игры (нажатие "Начать викторину") ====
document.getElementById("start-btn").addEventListener("click", async () => {
  clearInterval(pollIntervalId);
  await callNext();
  showScreen("game");
  startPollingGame();
});

// ==== Шаг 4: нажатие "Следующий вопрос" ====
document.getElementById("next-btn").addEventListener("click", async () => {
  const nextBtn = document.getElementById("next-btn");
  nextBtn.disabled = true;
  roundDuration = null; // новый раунд — заново определим длительность по первому /state
  const result = await callNext();
  nextBtn.disabled = false;
  if (result && result.status === "finished") {
    clearInterval(pollIntervalId);
    showFinished();
  }
});

async function callNext() {
  const res = await fetch(`${API_BASE}/rooms/${roomCode}/next`, { method: "POST" });
  if (!res.ok) {
    console.error("Ошибка /next:", await res.text());
    return null;
  }
  return res.json();
}

// ==== Шаг 5: во время игры — опрашиваем /state каждую секунду ====
let lastRenderedQuestionIndex = null;

function startPollingGame() {
  pollIntervalId = setInterval(async () => {
    const state = await fetchState();
    if (!state) return;
    if (DEBUG) console.debug("[quiz] /state →", state);
    if (state.status === "finished") {
      clearInterval(pollIntervalId);
      showFinished();
      return;
    }
    renderGameState(state);
  }, 1000);
}

function renderGameState(state) {
  // --- таймер-кольцо ---
  const remaining = Number(state.time_remaining ?? 0);
  if (roundDuration === null || remaining > roundDuration) roundDuration = Math.max(remaining, 1);
  setTimerRing(remaining, roundDuration);

  document.getElementById("qcounter").textContent =
    state.question_index != null ? `Вопрос ${state.question_index + 1}` : "Вопрос";

  // Перестраиваем вопрос и варианты ответа только когда вопрос реально сменился —
  // раньше это происходило на каждый опрос /state (раз в секунду), из-за чего
  // плитки постоянно пересоздавались и анимация появления проигрывалась заново
  // (отсюда и "мигание").
  if (state.question && state.question_index !== lastRenderedQuestionIndex) {
    lastRenderedQuestionIndex = state.question_index;

    document.getElementById("question-text").textContent = state.question.text;
    const optionsEl = document.getElementById("options");
    optionsEl.innerHTML = state.question.options
      .map((opt, i) => `
        <div class="option" style="animation-delay:${i * 0.06}s">
          <span class="idx">${i + 1}</span>
          <span>${escapeHtml(opt)}</span>
        </div>
      `)
      .join("");
  }

  renderAnsweredMeter(state.players);
  renderLeaderboard(state.players);
}

function renderAnsweredMeter(playersMap) {
  const el = document.getElementById("answered-meter");
  const players = Object.values(playersMap || {});
  // Показываем счётчик, только если бэкенд реально присылает флаг "answered" —
  // если поля нет ни у одного игрока, просто прячем блок вместо того, чтобы врать нулём.
  const hasAnsweredField = players.some(p => typeof p.answered === "boolean");
  if (!hasAnsweredField || players.length === 0) { el.classList.add("hidden"); return; }
  const answeredCount = players.filter(p => p.answered).length;
  el.classList.remove("hidden");
  el.innerHTML = `Ответили: <b>${answeredCount}</b> из ${players.length}`;
}

function setTimerRing(remaining, total) {
  const circumference = 169.6; // 2 * π * 27
  const ratio = Math.max(0, Math.min(1, remaining / total));
  const ring = document.getElementById("ring-fill");
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference * (1 - ratio);
  ring.style.stroke = ratio < 0.25 ? "var(--wrong)" : "var(--gold)";
  document.getElementById("timer-num").textContent = Math.max(0, Math.ceil(remaining));
}

// ==== Счёт игроков: устойчиво к именам полей и временным провалам в 0 ====
function extractScore(p) {
  const raw = p.score ?? p.points ?? p.total_score ?? p.totalScore ?? 0;
  const num = typeof raw === "number" ? raw : Number(raw);
  return Number.isFinite(num) ? num : 0;
}

function computePlayers(playersMap) {
  return Object.entries(playersMap || {})
    .map(([id, p]) => {
      const seen = extractScore(p);
      const best = Math.max(knownScores[id] || 0, seen);
      knownScores[id] = best;
      return { id, name: p.name, score: best };
    })
    .sort((a, b) => b.score - a.score);
}

// Живая таблица во время игры обновляется каждую секунду, поэтому здесь важно
// не пересоздавать DOM-узлы целиком (это и вызывало мигание), а обновлять уже
// существующие строки на месте и просто переставлять порядок через CSS order.
const liveRowRefs = {}; // playerId -> { row, rankEl, nameEl, scoreEl }

function renderLeaderboard(playersMap) {
  const container = document.getElementById("players-list");
  const players = computePlayers(playersMap);

  Object.keys(liveRowRefs).forEach(id => {
    if (!players.some(p => p.id === id)) {
      liveRowRefs[id].row.remove();
      delete liveRowRefs[id];
    }
  });

  players.forEach((p, i) => {
    let ref = liveRowRefs[p.id];
    if (!ref) {
      const row = document.createElement("div");
      row.className = "player-row";
      row.innerHTML = `<span class="rank"></span><span class="p-name"></span><span class="p-score"></span>`;
      ref = liveRowRefs[p.id] = {
        row,
        rankEl: row.querySelector(".rank"),
        nameEl: row.querySelector(".p-name"),
        scoreEl: row.querySelector(".p-score"),
      };
      container.appendChild(row);
    }
    ref.row.style.order = i;
    ref.rankEl.textContent = i + 1;
    ref.rankEl.className = "rank" + (i === 0 ? " top1" : i === 1 ? " top2" : i === 2 ? " top3" : "");
    ref.nameEl.textContent = p.name;
    if (ref.scoreEl.textContent !== String(p.score)) {
      ref.scoreEl.textContent = p.score;
      ref.scoreEl.classList.remove("bump");
      void ref.scoreEl.offsetWidth; // перезапускаем анимацию
      ref.scoreEl.classList.add("bump");
    }
  });
}

// ==== Шаг 6: экран окончания игры (рендерится один раз, тут пересборка DOM не проблема) ====
async function showFinished() {
  const state = await fetchState();
  const players = state ? computePlayers(state.players) : [];
  renderPodium(players.slice(0, 3));

  const restEl = document.getElementById("rest-players");
  restEl.innerHTML = players
    .slice(3)
    .map((p, i) => `
      <div class="player-row">
        <span class="rank">${i + 4}</span>
        <span class="p-name">${escapeHtml(p.name)}</span>
        <span class="p-score">${p.score}</span>
      </div>
    `)
    .join("");

  showScreen("finished");
}

function renderPodium(top3) {
  const podiumEl = document.getElementById("podium");
  const labels = ["p1", "p2", "p3"];
  podiumEl.innerHTML = top3
    .map((p, i) => `
      <div class="podium-slot ${labels[i]}">
        <div class="podium-name">${escapeHtml(p.name)}</div>
        <div class="podium-score">${p.score}</div>
        <div class="podium-block">${i === 0 ? "🥇" : i === 1 ? "🥈" : "🥉"}</div>
      </div>
    `)
    .join("");
}

// ==== Вспомогательное: запрос состояния комнаты ====
async function fetchState() {
  try {
    const res = await fetch(`${API_BASE}/rooms/${roomCode}/state`);
    if (!res.ok) return null;
    return await res.json();
  } catch (err) {
    console.error("Ошибка опроса /state:", err);
    return null;
  }
}

// ==== Вспомогательное: защита от XSS при вставке имён игроков в HTML ====
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ==== Старт: сразу показываем список квизов ====
loadQuizzes();
</script>
