<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Викторина — Игрок</title>
<style>
  :root {
    --bg: #14213D;
    --card: #1F2E52;
    --accent: #FCA311;
    --text: #E9ECF5;
    --muted: #8B96B8;
    --correct: #06D6A0;
    --wrong: #EF476F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .screen { width: 100%; max-width: 420px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px;
  }
  h1 { font-size: 22px; margin: 0 0 20px; text-align: center; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 18px;
    border-radius: 10px;
    border: 1px solid #33447A;
    background: #0F1830;
    color: var(--text);
    margin-bottom: 16px;
    text-align: center;
  }
  button {
    width: 100%;
    background: var(--accent);
    color: #14213D;
    border: none;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .error { color: var(--wrong); margin-top: 8px; font-size: 14px; text-align: center; }
  .hidden { display: none; }

  .center-hint {
    text-align: center;
    font-size: 18px;
    color: var(--muted);
    padding: 40px 0;
  }
  .score-badge {
    text-align: center;
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .score-badge b { color: var(--accent); }

  .question-text { font-size: 22px; font-weight: 700; margin-bottom: 20px; text-align: center; }
  .options { display: grid; gap: 12px; }
  .option-btn {
    background: #0F1830;
    border: 2px solid #33447A;
    color: var(--text);
    padding: 18px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 12px;
    text-align: left;
  }
  .option-btn:not(:disabled):active { transform: scale(0.98); }

  .feedback {
    text-align: center;
    padding: 40px 0;
  }
  .feedback.correct .feedback-title { color: var(--correct); }
  .feedback.wrong .feedback-title { color: var(--wrong); }
  .feedback-title { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
  .feedback-score { font-size: 18px; color: var(--muted); }

  .finished-title { font-size: 28px; text-align: center; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="screen">

  <!-- Экран 1: вход в комнату -->
  <div class="card" id="join-screen">
    <h1>Присоединиться к викторине</h1>
    <label for="room-code-input">Код комнаты</label>
    <input id="room-code-input" type="text" inputmode="numeric" placeholder="1234">
    <label for="name-input">Твоё имя</label>
    <input id="name-input" type="text" placeholder="Аня">
    <button id="join-btn">Войти</button>
    <div class="error hidden" id="join-error"></div>
  </div>

  <!-- Экран 2: ждём начала игры -->
  <div class="card hidden" id="lobby-screen">
    <div class="center-hint">Ты в игре! Ждём, пока ведущий начнёт викторину...</div>
  </div>

  <!-- Экран 3: активный вопрос, ждём выбора -->
  <div class="card hidden" id="question-screen">
    <div class="score-badge">Твои очки: <b id="current-score">0</b></div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options"></div>
  </div>

  <!-- Экран 4: ответ отправлен, ждём следующего вопроса -->
  <div class="card hidden" id="waiting-next-screen">
    <div class="center-hint" id="waiting-next-hint">Ответ принят! Ждём остальных...</div>
  </div>

  <!-- Экран 5: обратная связь после ответа -->
  <div class="card hidden" id="feedback-screen">
    <div class="feedback" id="feedback-content"></div>
  </div>

  <!-- Экран 6: игра окончена -->
  <div class="card hidden" id="finished-screen">
    <div class="finished-title">🏁 Игра окончена!</div>
    <div class="score-badge">Твой финальный счёт: <b id="final-score">0</b></div>
  </div>

</div>

<script>
// ==== Настройки ====
const API_BASE = "http://localhost:8080";

// ==== Состояние приложения ====
let roomCode = null;
let playerId = null;
let pollIntervalId = null;
let lastSeenQuestionIndex = -1; // чтобы понять, что вопрос сменился
let hasAnsweredCurrentQuestion = false;
let myScore = 0;

// ==== Ссылки на экраны ====
const screens = {
  join: document.getElementById("join-screen"),
  lobby: document.getElementById("lobby-screen"),
  question: document.getElementById("question-screen"),
  waitingNext: document.getElementById("waiting-next-screen"),
  feedback: document.getElementById("feedback-screen"),
  finished: document.getElementById("finished-screen"),
};

function showScreen(name) {
  Object.values(screens).forEach(el => el.classList.add("hidden"));
  screens[name].classList.remove("hidden");
}

// ==== Шаг 1: вход в комнату ====
document.getElementById("join-btn").addEventListener("click", async () => {
  const code = document.getElementById("room-code-input").value.trim();
  const name = document.getElementById("name-input").value.trim();
  const errorEl = document.getElementById("join-error");
  errorEl.classList.add("hidden");

  if (!code || !name) {
    errorEl.textContent = "Заполни код комнаты и имя";
    errorEl.classList.remove("hidden");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/rooms/${code}/join`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || `Ошибка сервера: ${res.status}`);
    }
    const player = await res.json();
    roomCode = code;
    playerId = player.id;
    showScreen("lobby");
    startPolling();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove("hidden");
  }
});

// ==== Опрос /state каждую секунду, реагируем на смену состояния ====
function startPolling() {
  pollIntervalId = setInterval(async () => {
    const state = await fetchState();
    if (!state) return;
    handleState(state);
  }, 1000);
}

function handleState(state) {
  if (state.status === "finished") {
    clearInterval(pollIntervalId);
    document.getElementById("final-score").textContent = myScore;
    showScreen("finished");
    return;
  }

  if (state.status === "waiting") {
    showScreen("lobby");
    return;
  }

  // status === "active"
  if (state.question_index !== lastSeenQuestionIndex) {
    // Пришёл новый вопрос — сбрасываем состояние "отвечал ли я"
    lastSeenQuestionIndex = state.question_index;
    hasAnsweredCurrentQuestion = false;
  }

  if (hasAnsweredCurrentQuestion) {
    // Уже отправили ответ — ждём, пока ведущий не переключит вопрос
    showScreen("waitingNext");
    return;
  }

  if (state.question) {
    renderQuestion(state.question);
    showScreen("question");
  }
}

function renderQuestion(question) {
  document.getElementById("current-score").textContent = myScore;
  document.getElementById("question-text").textContent = question.text;
  const optionsEl = document.getElementById("options");
  optionsEl.innerHTML = "";
  question.options.forEach((optText, index) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = optText;
    btn.addEventListener("click", () => submitAnswer(index));
    optionsEl.appendChild(btn);
  });
}

// ==== Отправка ответа ====
async function submitAnswer(optionIndex) {
  // Сразу блокируем все кнопки, чтобы нельзя было нажать дважды
  document.querySelectorAll(".option-btn").forEach(btn => (btn.disabled = true));
  hasAnsweredCurrentQuestion = true;

  try {
    const res = await fetch(`${API_BASE}/rooms/${roomCode}/answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ player_id: playerId, option: optionIndex }),
    });
    if (!res.ok) {
      // Например, кто-то другой уже ответил раньше или вопрос сменился —
      // просто переходим в режим ожидания, не показываем ошибку игроку
      showScreen("waitingNext");
      return;
    }
    const result = await res.json();
    myScore = result.new_score;
    showFeedback(result.correct);
  } catch (err) {
    console.error("Ошибка отправки ответа:", err);
    showScreen("waitingNext");
  }
}

function showFeedback(isCorrect) {
  const content = document.getElementById("feedback-content");
  const wrapper = content.parentElement;
  wrapper.className = "feedback " + (isCorrect ? "correct" : "wrong");
  content.innerHTML = `
    <div class="feedback-title">${isCorrect ? "✅ Верно!" : "❌ Неверно"}</div>
    <div class="feedback-score">Твои очки: ${myScore}</div>
  `;
  showScreen("feedback");

  // Через 2 секунды переключаемся на экран ожидания следующего вопроса
  setTimeout(() => {
    showScreen("waitingNext");
  }, 2000);
}

// ==== Вспомогательное: запрос состояния комнаты ====
async function fetchState() {
  try {
    const res = await fetch(`${API_BASE}/rooms/${roomCode}/state`);
    if (!res.ok) return null;
    return await res.json();
  } catch (err) {
    console.error("Ошибка опроса /state:", err);
    return null;
  }
}
</script>
</body>
</html>
