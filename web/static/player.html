<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Викторина — Игрок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0B0F2A;
    --bg-2: #1B1440;
    --surface: #171233;
    --surface-line: rgba(255,255,255,0.09);
    --ink: #F3F1FF;
    --muted: #9A9FC4;

    --gold: #FFC857;
    --violet: #8B7CFF;
    --teal: #2FE6C1;
    --rose: #FF5C8A;
    --wrong: #FF4757;

    --radius-lg: 22px;
    --radius-md: 15px;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: var(--bg-1);
    position: relative;
    overflow-x: hidden;
  }

  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora span { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .3; animation: drift 24s ease-in-out infinite alternate; }
  .aurora span:nth-child(1) { width: 420px; height: 420px; background: var(--violet); top: -160px; left: -140px; }
  .aurora span:nth-child(2) { width: 380px; height: 380px; background: var(--rose); bottom: -160px; right: -120px; animation-duration: 28s; animation-delay: -8s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,-30px) scale(1.1); } }

  .screen { width: 100%; max-width: 440px; position: relative; z-index: 1; }
  .card {
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius-lg);
    padding: 26px;
    box-shadow: 0 24px 50px -22px rgba(0,0,0,.55);
    animation: rise .45s var(--ease) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  h1 { font-family: "Fredoka", sans-serif; font-size: 22px; font-weight: 600; margin: 0 0 20px; text-align: center; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  input {
    width: 100%;
    padding: 15px 16px;
    font-size: 18px;
    font-family: inherit;
    border-radius: var(--radius-md);
    border: 1px solid var(--surface-line);
    background: rgba(255,255,255,0.04);
    color: var(--ink);
    margin-bottom: 16px;
    text-align: center;
    transition: border-color .2s var(--ease), background .2s var(--ease);
  }
  input:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.07); }

  button {
    width: 100%;
    background: var(--gold);
    color: #221200;
    border: none;
    padding: 17px;
    font-size: 18px;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: transform .15s var(--ease), box-shadow .15s var(--ease), opacity .15s;
    box-shadow: 0 8px 20px -8px rgba(255,200,87,0.55);
  }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .error { color: var(--wrong); margin-top: 8px; font-size: 14px; text-align: center; }
  .hidden { display: none !important; }

  .center-hint { text-align: center; font-size: 17px; color: var(--muted); padding: 34px 0 20px; }
  .loader { display: flex; justify-content: center; gap: 8px; margin-bottom: 4px; }
  .loader span { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); animation: bounce 1.1s ease-in-out infinite; }
  .loader span:nth-child(2) { animation-delay: .15s; } .loader span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-8px); opacity: 1; } }

  .score-badge { text-align: center; font-size: 15px; color: var(--muted); margin-bottom: 18px; }
  .score-badge b { font-family: "Fredoka", sans-serif; color: var(--gold); font-size: 18px; font-variant-numeric: tabular-nums; }

  .timebar-track { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); margin-bottom: 20px; overflow: hidden; }
  .timebar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 999px; transition: width .9s linear, background .25s; }

  .question-text { font-family: "Fredoka", sans-serif; font-size: 21px; font-weight: 600; line-height: 1.3; margin-bottom: 20px; text-align: center; animation: rise .4s var(--ease) both; }

  .options { display: grid; gap: 12px; }
  .option-btn {
    display: flex; align-items: center; gap: 12px;
    border: none;
    padding: 18px 16px;
    font-size: 17px;
    font-family: inherit;
    font-weight: 600;
    border-radius: var(--radius-md);
    text-align: left;
    color: #17102a;
    box-shadow: none;
    transition: transform .12s var(--ease), filter .12s var(--ease), opacity .2s;
    animation: pop .35s var(--ease) both;
  }
  .option-btn:nth-child(1) { background: var(--gold); }
  .option-btn:nth-child(2) { background: var(--violet); color: #fff; }
  .option-btn:nth-child(3) { background: var(--teal); }
  .option-btn:nth-child(4) { background: var(--rose); color: #fff; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .option-btn .idx {
    width: 26px; height: 26px; flex-shrink: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 13px;
  }
  .option-btn:not(:disabled):active { transform: scale(.97); }
  .option-btn:disabled { opacity: .35; }
  .option-btn.chosen { opacity: 1; filter: brightness(1.12); outline: 3px solid rgba(255,255,255,0.6); }

  .feedback { text-align: center; padding: 30px 0 10px; position: relative; }
  .feedback-icon { width: 76px; height: 76px; margin: 0 auto 14px; }
  .feedback-icon svg { width: 100%; height: 100%; }
  .feedback-icon circle, .feedback-icon path {
    stroke-dasharray: 100; stroke-dashoffset: 100;
    animation: draw .5s var(--ease) forwards;
  }
  .feedback-icon path { animation-delay: .25s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .feedback.correct .feedback-icon circle, .feedback.correct .feedback-icon path { stroke: var(--teal); }
  .feedback.wrong .feedback-icon circle, .feedback.wrong .feedback-icon path { stroke: var(--wrong); }
  .feedback-title { font-family: "Fredoka", sans-serif; font-size: 26px; font-weight: 600; margin-bottom: 10px; }
  .feedback.correct .feedback-title { color: var(--teal); }
  .feedback.wrong .feedback-title { color: var(--wrong); }
  .feedback-score { font-size: 16px; color: var(--muted); }
  .feedback-score b { color: var(--gold); font-family: "Fredoka", sans-serif; }

  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .confetti i {
    position: absolute; top: 40%; left: 50%; width: 8px; height: 8px; border-radius: 2px;
    animation: burst .9s var(--ease) forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--tx), var(--ty)) rotate(var(--tr)); opacity: 0; }
  }

  .finished-title { font-family: "Fredoka", sans-serif; font-size: 26px; font-weight: 600; text-align: center; margin-bottom: 6px; }
  .finished-rank { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 18px; }
  .final-score { text-align: center; font-family: "Fredoka", sans-serif; font-size: 44px; font-weight: 700; color: var(--gold); }
</style>
<link rel="stylesheet" href="menu.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<meta name="theme-color" content="#292a2c">
</head>
<body>
<header class="site-header"><a class="brand" href="/">QUIZZY.</a><span class="site-label">Пространство игрока</span><div class="theme-switch" role="group" aria-label="Оформление сайта">
  <button type="button" data-theme-choice="graphite" aria-pressed="true"><span class="theme-swatch swatch-graphite" aria-hidden="true"></span>Графит</button>
  <button type="button" data-theme-choice="crimson" aria-pressed="false"><span class="theme-swatch swatch-crimson" aria-hidden="true"></span>Рубин</button>
</div></header>

<div class="aurora"><span></span><span></span></div>

<div class="screen">
  <div class="error hidden" id="connection-error" role="status" aria-live="polite"></div>

  <!-- Экран 1: вход в комнату -->
  <div class="card" id="join-screen">
    <h1>Присоединиться к викторине</h1>
    <label for="room-code-input">Код комнаты</label>
    <input id="room-code-input" type="text" inputmode="numeric" placeholder="1234">
    <label for="name-input">Твоё имя</label>
    <input id="name-input" type="text" placeholder="Аня">
    <button id="join-btn">Войти</button>
    <div class="error hidden" id="join-error"></div>
  </div>

  <!-- Экран 2: ждём начала игры -->
  <div class="card hidden" id="lobby-screen">
    <div class="loader"><span></span><span></span><span></span></div>
    <div class="center-hint">Ты в игре! Ждём, пока ведущий начнёт викторину...</div>
  </div>

  <!-- Экран 3: активный вопрос, ждём выбора -->
  <div class="card hidden" id="question-screen">
    <div class="score-badge"><span id="question-number"></span> · <span id="seconds-left"></span></div>
    <div class="score-badge">Твои очки: <b id="current-score">0</b></div>
    <div class="timebar-track"><div class="timebar-fill" id="timebar-fill" style="width:100%"></div></div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options"></div>
  </div>

  <!-- Экран 4: ответ отправлен, ждём следующего вопроса -->
  <div class="card hidden" id="waiting-next-screen">
    <div class="loader"><span></span><span></span><span></span></div>
    <div class="center-hint" id="waiting-next-hint">Все вопросы пройдены! Ждём остальных…</div>
    <div class="score-badge">Твои очки: <b id="waiting-score">0</b></div>
  </div>

  <!-- Экран 5: обратная связь после ответа -->
  <div class="card hidden" id="feedback-screen">
    <div class="feedback" id="feedback-content"></div>
  </div>

  <!-- Экран 6: игра окончена -->
  <div class="card finished-screen hidden" id="finished-screen">
    <a class="menu-close" href="/" aria-label="Вернуться в главное меню" title="В главное меню">&times;</a>
    <div class="finished-title">Игра окончена</div>
    <div class="finished-rank" id="finished-rank"></div>
    <div class="final-score" id="final-score">0</div>
  </div>

</div>

<script>
const API_BASE = location.origin;
let roomCode = null;
let playerId = null;
let busy = false;
let finished = false;
let pollTimer = null;
let currentIndex = -1;
let renderedIndex = null;
let myScore = 0;
let roundDuration = 1;
let remaining = 0;
let pendingAnswer = null;
let pendingAdvance = null;
let activeReadController = null;
let urgentRun = false;
let countdownFrame = null;
let questionDeadline = 0;
let expiryRequestedFor = null;

const screens = Object.fromEntries([
  ["join", "join-screen"], ["lobby", "lobby-screen"],
  ["question", "question-screen"], ["waiting", "waiting-next-screen"],
  ["feedback", "feedback-screen"], ["finished", "finished-screen"],
].map(([name, id]) => [name, document.getElementById(id)]));

function showScreen(name) {
  if (name !== "question") {
    cancelAnimationFrame(countdownFrame);
    countdownFrame = null;
  }
  for (const [key, el] of Object.entries(screens)) el.classList.toggle("hidden", key !== name);
}

function connectionError(message) {
  const el = document.getElementById("connection-error");
  el.textContent = message;
  el.classList.toggle("hidden", !message);
}

async function request(path, body) {
  const controller = new AbortController();
  if (body === undefined) activeReadController = controller;
  const timeout = setTimeout(() => controller.abort(), 8000);
  try {
    const res = await fetch(`${API_BASE}${path}`, {
      method: body === undefined ? "GET" : "POST",
      headers: body === undefined ? {} : { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: controller.signal,
    });
    if (!res.ok) {
      const err = new Error(await res.text());
      err.status = res.status;
      throw err;
    }
    return await res.json();
  } finally {
    clearTimeout(timeout);
    if (activeReadController === controller) activeReadController = null;
  }
}

// A single request sequence prevents old polls from overwriting newer screens.
async function run(task = async () => {}) {
  if (busy || finished) return;
  busy = true;
  clearTimeout(pollTimer);
  try {
    await task();
    if (roomCode) {
      if (pendingAnswer) await sendPendingAnswer();
      await syncState();
    }
    connectionError("");
  } catch (err) {
    if (!(err.name === "AbortError" && urgentRun)) {
      connectionError("Не удалось обновить игру. Проверьте подключение — повторяем автоматически…");
    }
  } finally {
    busy = false;
    const delay = urgentRun ? 0 : 1000;
    urgentRun = false;
    if (roomCode && !finished) pollTimer = setTimeout(() => run(), delay);
  }
}

const joinButton = document.getElementById("join-btn");
joinButton.addEventListener("click", async () => {
  if (busy) return;
  const code = document.getElementById("room-code-input").value.trim();
  const name = document.getElementById("name-input").value.trim();
  const error = document.getElementById("join-error");
  error.classList.add("hidden");
  if (!code || !name) {
    error.textContent = "Заполни код комнаты и имя";
    error.classList.remove("hidden");
    return;
  }
  joinButton.disabled = true;
  await run(async () => {
    try {
      const player = await request(`/rooms/${encodeURIComponent(code)}/join`, { name });
      roomCode = encodeURIComponent(code);
      playerId = player.id;
      showScreen("lobby");
    } catch (err) {
      error.textContent = err.status === 404 ? "Комната не найдена. Проверь код."
        : err.status === 409 ? "Игра уже началась, вход закрыт."
        : "Не удалось войти. Проверь подключение и попробуй снова.";
      error.classList.remove("hidden");
    }
  });
  joinButton.disabled = false;
});

async function syncState() {
  if (pendingAnswer) return;
  const room = await request(`/rooms/${roomCode}/state`);
  if (room.status === "finished") {
    finished = true;
    pendingAnswer = null;
    pendingAdvance = null;
    showFinalScreen(room);
    return;
  }
  if (pendingAnswer) return;
  if (room.status === "waiting") { showScreen("lobby"); return; }
  let state = await request(`/rooms/${roomCode}/state/${playerId}`);
  if (pendingAnswer) return;
  myScore = Number(state.player.score);
  if (state.player.status === false) { showWaiting(room); return; }
  currentIndex = state.question_index;
  if (pendingAdvance !== null && pendingAdvance !== currentIndex) pendingAdvance = null;
  if (currentIndex === -1 || pendingAdvance === currentIndex || state.time_remaining <= 0) {
    const index = currentIndex;
    pendingAdvance = index;
    showScreen("feedback");
    document.getElementById("feedback-content").className = "feedback";
    document.getElementById("feedback-content").textContent = "Загружаем следующий вопрос…";
    try {
      await request(`/rooms/${roomCode}/next/${playerId}`, { question_index: index });
      pendingAdvance = null;
    } catch (err) {
      if (err.status !== 409) throw err;
      // Another tab or a retried request may already have advanced this player.
    }
    state = await request(`/rooms/${roomCode}/state/${playerId}`);
    myScore = Number(state.player.score);
    if (state.player.status === false) {
      pendingAdvance = null;
      const latest = await request(`/rooms/${roomCode}/state`);
      if (latest.status === "finished") { finished = true; showFinalScreen(latest); }
      else showWaiting(latest);
      return;
    }
    currentIndex = state.question_index;
    if (currentIndex !== index) pendingAdvance = null;
  }
  renderQuestion(state);
}

function showWaiting(room) {
  const players = Object.values(room.players || {});
  const count = players.filter(p => p.status === false).length;
  document.getElementById("waiting-next-hint").textContent =
    `Все вопросы пройдены! Ждём остальных. Завершили: ${count} из ${players.length}.`;
  document.getElementById("waiting-score").textContent = myScore;
  showScreen("waiting");
}

function renderQuestion(state) {
  if (!state.question) return;
  remaining = Math.max(0, Number(state.time_remaining));
  const observedDeadline = performance.now() + remaining * 1000;
  if (renderedIndex !== state.question_index) {
    questionDeadline = observedDeadline;
    expiryRequestedFor = null;
    renderedIndex = state.question_index;
    roundDuration = Math.max(remaining, 1);
    document.getElementById("question-text").textContent = state.question.text;
    const options = document.getElementById("options");
    options.innerHTML = "";
    state.question.options.forEach((text, option) => {
      const button = document.createElement("button");
      button.className = "option-btn";
      button.innerHTML = `<span class="idx">${option + 1}</span><span>${escapeHtml(text)}</span>`;
      button.addEventListener("click", () => submitAnswer(option, button));
      options.appendChild(button);
    });
  }
  // Never move the bar backwards when the server returns whole seconds.
  questionDeadline = Math.min(questionDeadline, observedDeadline);
  document.getElementById("question-number").textContent = `Вопрос ${state.question_index + 1}`;
  document.getElementById("seconds-left").textContent = `${Math.max(0, remaining)} с`;
  document.getElementById("current-score").textContent = myScore;
  document.querySelectorAll(".option-btn").forEach(button => {
    button.disabled = remaining <= 0 || pendingAnswer !== null || pendingAdvance !== null;
  });
  showScreen("question");
  cancelAnimationFrame(countdownFrame);
  drawCountdown();
}

function drawCountdown() {
  remaining = Math.max(0, (questionDeadline - performance.now()) / 1000);
  const ratio = Math.min(1, remaining / roundDuration);
  const fill = document.getElementById("timebar-fill");
  fill.style.transform = `scaleX(${ratio})`;
  fill.classList.toggle("running-out", ratio < .25);
  const label = `${Math.ceil(remaining)} с`;
  const seconds = document.getElementById("seconds-left");
  if (seconds.textContent !== label) seconds.textContent = label;
  if (remaining > 0) {
    countdownFrame = requestAnimationFrame(drawCountdown);
  } else {
    countdownFrame = null;
    document.querySelectorAll(".option-btn").forEach(button => { button.disabled = true; });
    if (expiryRequestedFor !== renderedIndex && !pendingAnswer && pendingAdvance === null) {
      expiryRequestedFor = renderedIndex;
      if (busy) urgentRun = true;
      else void run();
    }
  }
}

async function submitAnswer(option, button) {
  if (finished || remaining <= 0 || pendingAnswer || pendingAdvance !== null) return;
  pendingAnswer = { player_id: playerId, question_index: renderedIndex, option };
  button.classList.add("chosen");
  document.querySelectorAll(".option-btn").forEach(el => { el.disabled = true; });
  if (busy) {
    // Keep the first click and give it priority over background polling.
    urgentRun = true;
    activeReadController?.abort();
    return;
  }
  await run();
}

async function sendPendingAnswer() {
  const answer = pendingAnswer;
  try {
    const result = await request(`/rooms/${roomCode}/answer`, answer);
    const previousScore = myScore;
    myScore = Number(result.new_score);
    pendingAnswer = null;
    pendingAdvance = answer.question_index;
    const content = document.getElementById("feedback-content");
    content.className = "feedback " + (result.correct ? "correct" : "wrong");
    const earned = myScore - previousScore;
    content.innerHTML = `<div class="feedback-title">${result.correct ? "Верно!" : "Неверно"}</div>
      <div class="feedback-score">За ответ: <b>${earned > 0 ? "+" : ""}${earned}</b><br>Твои очки: <b>${myScore}</b></div>`;
    showScreen("feedback");
    await new Promise(resolve => setTimeout(resolve, 650));
  } catch (err) {
    if (err.status !== 409) throw err;
    // A duplicate, expired or stale answer is reconciled through player state.
    pendingAnswer = null;
    pendingAdvance = answer.question_index;
  }
}

function showFinalScreen(room) {
  const players = Object.entries(room.players || {})
    .map(([id, p]) => ({ id, score: Number(p.score) }))
    .sort((a, b) => b.score - a.score);
  const own = players.find(p => p.id === playerId);
  if (own) myScore = own.score;
  document.getElementById("final-score").textContent = myScore;
  document.getElementById("finished-rank").textContent = own
    ? `Ты на ${players.findIndex(p => p.id === playerId) + 1}-м месте из ${players.length}` : "";
  showScreen("finished");
}

function escapeHtml(value) {
  const el = document.createElement("div");
  el.textContent = value;
  return el.innerHTML;
}
</script>
</body>
</html>
